<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="635" viewBox="0 0 1160 635" role="img" aria-labelledby="title desc"><title id="title">Application and web: effects of priority and core placement</title><desc id="desc">Matched synthetic workload. Deadline miss and skipped-period rates use counter deltas. Start jitter p99 is a histogram upper bound for the configuration epoch. Percent workload is approximate calibrated work, not measured CPU duty.</desc><rect width="1160" height="635" fill="#faf8f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="32" font-size="21" fill="#352f28" >Application and web: effects of priority and core placement</text><text x="24" y="56" font-size="14" fill="#352f28" >10 ms application period · 2 WS + 2 SSE + API + 64 KiB file · 20 s/case · dedicated TX worker</text><rect x="24" y="72" width="12" height="12" fill="#ba6354"/><text x="43" y="83" font-size="12" fill="#352f28" >Late jobs</text><rect x="218" y="72" width="12" height="12" fill="#d4a14b"/><text x="237" y="83" font-size="12" fill="#352f28" >Skipped periods</text><text x="505" y="83" font-size="12" fill="#352f28" >p1/p6: app priority (6 above 1); HTTP/WS/TX = 5, SSE = 4</text><text x="345" y="111" font-size="14" fill="#352f28" >Deadline violations, %</text><text x="345" y="136" font-size="11" fill="#71675c" text-anchor="middle">0</text><path d="M345 146V526" stroke="#e1dace"/><text x="392.5" y="136" font-size="11" fill="#71675c" text-anchor="middle">12.5</text><path d="M392.5 146V526" stroke="#e1dace"/><text x="440" y="136" font-size="11" fill="#71675c" text-anchor="middle">25</text><path d="M440 146V526" stroke="#e1dace"/><text x="487.5" y="136" font-size="11" fill="#71675c" text-anchor="middle">37.5</text><path d="M487.5 146V526" stroke="#e1dace"/><text x="535" y="136" font-size="11" fill="#71675c" text-anchor="middle">50</text><path d="M535 146V526" stroke="#e1dace"/><text x="655" y="111" font-size="14" fill="#352f28" >API p95, ms</text><text x="655" y="13