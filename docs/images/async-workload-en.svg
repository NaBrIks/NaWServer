y="488" font-size="12" fill="#352f28" >55.6</text><rect x="945" y="472" width="140.39335142338408" height="22" fill="#538b72"/><text x="1091.393351423384" y="488" font-size="12" fill="#352f28" >68.1</text><text x="24" y="559" font-size="12" fill="#352f28" >50/80% is approximate calibrated work on one core. CPU0/CPU1 execute the same iteration count.</text><text x="24" y="582" font-size="12" fill="#352f28" >Jitter p99 is an epoch histogram bound; deadline rates use counter deltas. API p95 includes Wi-Fi and client time.</text><text x="24" y="605" font-size="12" fill="#352f28" >Transfer errors, maxima and matched no-web application cases are in the report. This short run gives no real-time guarantees.</text></g></svg>
