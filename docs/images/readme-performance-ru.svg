<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468" role="img" aria-labelledby="title desc"><title id="title">Отзывчивость и средняя загрузка CPU</title><desc id="desc">Same Wi-Fi workload; API p95 is round-trip latency, not server-only processing. CPU is normalized across available cores.</desc><rect width="1100" height="468" fill="#faf8f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="32" font-size="22" fill="#352f28" >Отзывчивость и средняя загрузка CPU</text><text x="24" y="56" font-size="14" fill="#352f28" >API 1/с · WS 256 Б × 2/с на соединение · SSE 1/с · 45 с · cooperative TX</text><text x="190" y="90" font-size="16" fill="#352f28" >CPU во время обмена, %</text><text x="670" y="90" font-size="16" fill="#352f28" >API p95, мс (Wi-Fi round trip)</text><text x="190" y="115" font-size="12" fill="#71675c" text-anchor="middle">0</text><path d="M190 124V408" stroke="#e1dace" stroke-width="1"/><text x="270" y="115" font-size="12" fill="#71675c" text-anchor="middle">3</text><path d="M270 124V408" stroke="#e1dace" stroke-width="1"/><text x="350" y="115" font-size="12" fill="#71675c" text-anchor="middle">6</text><path d="M350 124V408" stroke="#e1dace" stroke-width="1"/><text x="430" y="115" font-size="12" fill="#71675c" text-anchor="middle">9</text><path d="M430 124V408" stroke="#e1dace" stroke-width="1"/><text x="510" y="115" font-size="12" fill="#71675c" text-anchor="middle">12</text><path d="M510 124V408" stroke="#e1dace" stroke-width="1"/><text x="670" y="115" font-size="12" fill="#71675c" text-anchor="middle">0</text><path d="M670 124V408" stroke="#e1dace" stroke-width="1"/><text x="750" y="115" font-size="12" fill="#71675c" text-anchor="middle">15</text><path d="M750 124V408" stroke="#e1dace" stroke-width="1"/><text x="830" y="115" font-size="12" fill="#71675c" text-anchor="middle">30</text><path d="M830 124V408" stroke="#e1dace" stroke-width="1"/><text x="910" y="115" font-size="12" fill="#71675c" text-anchor="middle">45</text><path d="M910 124V408" stroke="#e1dace" stroke-width="1"/><text x="990" y="115" font-size="12" fill="#71675c" text-anchor="middle">60</text><path d="M990 124V408" stroke="#e1dace" stroke-width="1"/><text x="24" y="151" font-size="14" fill="#352f28" >C3 · Мини</text><rect x="190" y="133" width="68.28687713190813" height="24" fill="#597c9d"/><text x="265.2868771319081" y="151" font-size="13" fill="#352f28" >2,56%</text><rect x="670" y="133" width="223.80746666664103" height="24" fill="#597c9d"/><text x="900.8074666666411" y="151" font-size="13" fill="#352f28" >41,96</text><text x="24" y="193" font-size="14" fill="#352f28" >C3 · Нормальный</text><rect x="190" y="175" width="192.1148404809328" height="24" fill="#597c9d"/><text x="389.1148404809328" y="193" font-size="13" fill="#352f28" >7,20%</text><rect x="670" y="175" width="194.96533333323896" height="24" fill="#597c9d"/><text x="871.965333333239" y="193" font-size="13" fill="#352f28" >36,56</text><text x="24" y="235" font-size="14" fill="#352f28" >C3 · Максимальный</text><rect x="190" y="217" width="289.3000353606789" height="24" fill="#597c9d"/><text x="486.3000353606789" y="235" font-size="13" fill="#352f28" >10,85%</text><rect x="670" y="217" width="224.88959999999497" height="24" fill="#597c9d"/><text x="901.889599999995" y="235" font-size="13" fill="#352f28" >42,17</text><text x="24" y="291" font-size="14" fill="#352f28" >S3 · Мини</text><rect x="190" y="273" width="50.588162325004426" height="24" fill="#538b72"/><text x="247.58816232500442" y="291" font-size="13" fill="#352f28" >1,90%</text><rect x="670" y="273" width="278.0405333333183" height="24" fill="#538b72"/><text x="955.0405333333183" y="291" font-size="13" fill="#352f28" >52,13</text><text x="24" y="333" font-size="14" fill="#352f28" >S3 · Нормальный</text><rect x="190" y="315" width="140.06270071903504" height="24" fill="#538b72"/><text x="337.06270071903504" y="333" font-size="13" fill="#352f28" >5,25%</text><rect x="670" y="315" width="217.7994666666103" height="24" fill="#538b72"/><text x="894.7994666666103" y="333" font-size="13" fill="#352f28" >40,84</text><text x="24" y="375" font-size="14" fill="#352f28" >S3 · Максимальный †</text><rect x="190" y="357" width="235.555863163875" height="24" fill="#538b72"/><text x="432.55586316387496" y="375" font-size="13" fill="#352f28" >8,83%</text><rect x="670" y="357" width="199.83573333336972" height="24" fill="#538b72"/><text x="876.8357333333697" y="375" font-size="13" fill="#352f28" >37,47</text><text x="24" y="432" font-size="13" fill="#352f28" >† Максимальный S3: API и SSE без потерь; 1 отказ WS из 540 (0,19%). Это предел теста с замечанием.</text><text x="24" y="454" font-size="12" fill="#655c50" >CPU: среднее по доступным ядрам. API p95 включает сеть и клиент, не только обработчик.</text></g></svg>
