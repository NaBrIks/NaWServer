# Owner-approved C/C++ profile. Use Uncrustify 0.83.0_f.
# Exclude vendor/generated files through the companion check/apply commands.
newlines = lf
input_tab_size = 4
output_tab_size = 4
indent_columns = 4
indent_with_tabs = 1
indent_namespace = true
indent_class = true
indent_access_spec = -4
indent_class_colon = true
indent_constr_colon = true
indent_ctor_init_leading = 2
indent_ctor_init = -2
indent_continue = 4
code_width = 120
nl_max = 2

sp_arith = force
sp_assign = force
sp_bool = force
sp_compare = force
sp_after_comma = force
sp_before_comma = remove
sp_after_semi_for = force
sp_before_sparen = remove
sp_inside_sparen = remove
sp_inside_fparen = remove
sp_inside_paren = remove
sp_func_def_paren = remove
sp_func_proto_paren = remove
sp_func_call_paren = remove
sp_before_ptr_star = force
sp_after_ptr_star = remove
sp_before_byref = force
sp_after_byref = remove
sp_cond_question = force
sp_cond_colon = force
sp_cpp_lambda_square_paren = remove

nl_namespace_brace = force
nl_class_brace = force
nl_fdef_brace = force
nl_if_brace = force
nl_else_brace = force
nl_for_brace = force
nl_while_brace = force
nl_switch_brace = force
nl_brace_else = force
nl_after_if = force
nl_if_leave_one_liners = true
nl_split_if_one_liner = false
nl_create_if_one_liner = false
nl_create_func_def_one_liner = false
# Two newline characters mean one empty line between function definitions.
nl_after_func_body = 2
nl_after_func_body_class = 2
nl_after_func_body_one_liner = 2
nl_constr_colon = force
pos_constr_colon = lead

align_var_def_span = 0
align_assign_span = 0
align_on_tabstop = false
align_keep_tabs = false
mod_full_brace_if = ignore
mod_full_brace_for = ignore
mod_full_brace_while = ignore
mod_sort_include = false
