[platformio]
default_envs = s3
src_dir = main

[env:s3]
platform = espressif32@8.0.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v5.5.6
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
build_flags = -std=gnu++17
build_unflags = -std=gnu++2b -std=gnu++23 -std=gnu++20

[env:s3_tcp]
extends = env:s3
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3_tcp
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.tcp.defaults

[env:s3_tcp_mcp]
extends = env:s3_tcp
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3_tcp_mcp
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.tcp.defaults;sdkconfig.mcp.defaults"

[env:s3_tcp_mcp_yyjson]
extends = env:s3_tcp_mcp
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3_tcp_mcp_yyjson
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.tcp.defaults;sdkconfig.mcp.defaults;../common/sdkconfig.yyjson.defaults"
