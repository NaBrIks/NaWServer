<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" fill="#faf8f3"/><g font-family="Segoe UI,Arial" fill="#302b24"><text x="24" y="30" font-size="19" font-weight="600">Стоимость запуска: HTTP, менеджер и TX</text><text x="24" y="52" font-size="12">Динамическая internal SRAM, Б. Общая работающая сеть уже в базе. TX payload выделяется по запросу.</text><text x="24" y="88" font-size="16" font-weight="600">ESP32-C3</text><text x="24" y="126" font-size="12">HTTPD</text><rect x="135.00" y="112" width="87.19" height="20" fill="#88857e"/><text x="228.19" y="126" font-size="12">11 532</text><text x="24" y="179" font-size="12">Наш HTTP</text><rect x="135.00" y="165" width="92.56" height="20" fill="#668ca3"/><text x="233.56" y="179" font-size="12">12 242</text><text x="24" y="232" font-size="12">+ менеджер</text><rect x="135.00" y="218" width="92.56" height="20" fill="#668ca3"/><rect x="227.56" y="218" width="66.08" height="20" fill="#c8a65d"/><text x="299.64" y="232" font-size="12">20 982</text><text x="24" y="285" font-size="12">+ TX</text><rect x="135.00" y="271" width="92.56" height="20" fill="#668ca3"/><rect x="227.56" y="271" width="66.08" height="20" fill="#c8a65d"/><rect x="293.64" y="271" width="45.28" height="20" fill="#ac7867"/><text x="344.92" y="285" font-size="12">26 970</text><text x="24" y="338" font-size="12">+ маршруты</text><rect x="135.00" y="324" width="92.56" height="20" fill="#668ca3"/><rect x="227.56" y="324" width="66.08" height="20" fill="#c8a65d"/><rect x="293.64" y="324" width="45.28" height="20" fill="#ac7867"/><rect x="338.92" y="324" width="1.54" height="20" fill="#7e9c88"/><text x="346.46" y="338" font-size="12">27 174</text><text x="24" y="391" font-size="12">Мини-демо*</text><rect x="135.00" y="377" width="92.56" height="20" fill="#668ca3"/><rect x="227.56" y="377" width="66.08" height="20" fill="#c8a65d"/><rect x="293.64" y="377" width="45.28" height="20" fill="#ac7867"/><rect x="338.92" y="377" width="71.66" height="20" fill="#9b93a4"/><text x="416.58" y="391" font-size="12">36 448</text><text x="576" y="88" font-size="16" font-weight="600">ESP32-S3</text><text x="576" y="126" font-size="12">HTTPD</text><rect x="687.00" y="112" width="87.28" height="20" fill="#88857e"/><text x="780.28" y="126" font-size="12">11 544</text><text x="576" y="179" font-size="12">Наш HTTP</text><rect x="687.00" y="165" width="92.62" height="20" fill="#668ca3"/><text x="785.62" y="179" font-size="12">12 250</text><text x="576" y="232" font-size="12">+ менеджер</text><rect x="687.00" y="218" width="92.62" height="20" fill="#668ca3"/><rect x="779.62" y="218" width="65.92" height="20" fill="#c8a65d"/><text x="851.54" y="232" font-size="12">20 968</text><text x="576" y="285" font-size="12">+ TX</text><rect x="687.00" y="271" width="92.62" height="20" fill="#668ca3"/><rect x="779.62" y="271" width="65.92" height="20" fill="#c8a65d"/><rect x="845.54" y="271" width="44.96" height="20" fill="#ac7867"/><text x="896.50" y="285" font-size="12">26 914</text><text x="576" y="338" font-size="12">+ маршруты</text><rect x="687.00" y="324" width="92.62" height="20" fill="#668ca3"/><rect x="779.62" y="324" width="65.92" height="20" fill="#c8a65d"/><rect x="845.54" y="324" width="44.96" height="20" fill="#ac7867"/><rect x="890.50" y="324" width="1.54" height="20" fill="#7e9c88"/><text x="898.04" y="338" font-size="12">27 118</text><text x="576" y="391" font-size="12">Мини-демо*</text><rect x="687.00" y="377" width="92.62" height="20" fill="#668ca3"/><rect x="779.62" y="377" width="65.92" height="20" fill="#c8a65d"/><rect x="845.54" y="377" width="44.96" height="20" fill="#ac7867"/><rect x="890.50" y="377" width="71.81" height="20" fill="#9b93a4"/><text x="968.31" y="391" font-size="12">36 412</text><rect x="24" y="461" width="12" height="12" fill="#668ca3"/><text x="43" y="472" font-size="12">Наш HTTP</text><rect x="234" y="461" width="12" height="12" fill="#c8a65d"/><text x="253" y="472" font-size="12">Менеджер</text><rect x="444" y="461" width="12" height="12" fill="#ac7867"/><text x="463" y="472" font-size="12">TX и задача</text><rect x="654" y="461" width="12" height="12" fill="#7e9c88"/><text x="673" y="472" font-size="12">Маршруты</text><rect x="864" y="461" width="12" height="12" fill="#9b93a4"/><text x="883" y="472" font-size="12">Демо/SSE</text><text x="24" y="505" font-size="12">* Мини-демо: 5 соединений, 11 маршрутов, SSE и OTA; минимальные HTTP-варианты: 4 соединения.</text><text x="24" y="527" font-size="12">Сегменты показывают измеренные прибавки при включении слоя. Статическая SRAM и нагрузочные минимумы — отдельно в отчёте.</text></g></svg>