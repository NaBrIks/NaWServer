<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Расход динамической памяти при запуске: до и после оптимизации</title>
<desc id="desc">Сравнение HTTPD и минимального NaWServer на C3 и S3; отдельно полная демка на Pico до и после. Pico не сравнивается с HTTPD.</desc>
<rect width="1100" height="390" fill="#fffdf9"/>
<g font-family="Arial,sans-serif" fill="#29251f">
<text x="30" y="36" font-size="23" font-weight="bold">Расход динамической памяти при запуске</text>
<text x="30" y="61" font-size="14">Занято сверх подготовленной системы с Wi‑Fi; статическая память до запуска здесь не включена.</text>
<g font-size="14" font-weight="bold"><text x="30" y="112">C3</text><text x="30" y="206">S3</text><text x="30" y="300">Pico 2 W</text></g>
<g font-size="13"><text x="125" y="94">HTTPD</text><text x="125" y="116">NaW до</text><text x="125" y="138">NaW после</text><text x="125" y="188">HTTPD</text><text x="125" y="210">NaW до</text><text x="125" y="232">NaW после</text><text x="125" y="304">Демо до</text><text x="125" y="326">Демо после</text></g>
<g fill="#a5a39b"><rect x="220" y="80" width="143" height="16"/><rect x="220" y="174" width="143" height="16"/></g>
<g fill="#d99059"><rect x="220" y="102" width="420" height="16"/><rect x="220" y="196" width="416" height="16"/><rect x="220" y="290" width="512" height="16"/></g>
<g fill="#6aab83"><rect x="220" y="124" width="329" height="16"/><rect x="220" y="218" width="329" height="16"/><rect x="220" y="312" width="436" height="16"/></g>
<g font-size="13"><text x="370" y="93">11 548 Б</text><text x="647" y="115">33 864 Б</text><text x="556" y="137">26 536 Б</text><text x="370" y="187">11 524 Б</text><text x="643" y="209">33 572 Б</text><text x="556" y="231">26 488 Б</text><text x="739" y="303">41 280 Б</text><text x="663" y="325">35 144 Б</text></g>
<g font-size="17" font-weight="bold" fill="#316749"><text x="820" y="116">−21,6%</text><text x="820" y="210">−21,1%</text><text x="820" y="319">−14,9%</text></g>
<g font-size="12" fill="#595249"><text x="30" y="365">C3/S3: минимальный GET, четыре слота. Pico: полная демка, до 4 слота, после 5; разные конфигурации.</text><text x="30" y="382">Проценты: изменение NaWServer относительно его исходного расхода; SRAM и куча не смешиваются.</text></g>
</g></svg>
