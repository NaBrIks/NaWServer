[platformio]
default_envs = c3
src_dir = main

[env]
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v5.5.6
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
platform = espressif32@8.0.0
framework = espidf

[env:c3]
board = esp32-c3-devkitm-1
build_flags = -std=gnu++17
build_unflags = -std=gnu++2b -std=gnu++23 -std=gnu++20

[env:c6]
board = esp32-c6-devkitc-1

[env:esp32]
board = esp32dev

[env:s2]
board = esp32-s2-saola-1

[env:s3]
board = esp32-s3-devkitc-1

[env:c3_idf6]
extends = env:c3
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v6.1
    platformio/toolchain-riscv32-esp@15.2.0+20251204
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.c3_idf6
